name: Static Analysis

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'refactor/**', 'infra/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            cppcheck \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ninja-build \
            yamllint

      - name: YAML lint
        run: yamllint .github .yamllint.yml

      - name: Format check
        # 通过 bash 调用：本仓库脚本以 100644 模式提交，不带可执行位。
        run: bash scripts/static_analysis.sh format-check --require-tools

      - name: Configure clang-tidy database
        run: cmake --preset ninja-debug

      - name: Clang-tidy
        run: bash scripts/static_analysis.sh tidy --require-tools

      - name: Cppcheck
        run: bash scripts/static_analysis.sh cppcheck --require-tools
